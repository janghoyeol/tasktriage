name: Triage Service CI

on:
  push:
    branches: [master]
    paths:
      - "triage-service/**"
      - ".github/workflows/triage-service-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "triage-service/**"
      - ".github/workflows/triage-service-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: triage-service/requirements.txt

      - run: pip install -r requirements.txt

      # 아직 자동화된 pytest가 없어서, 최소한 앱이 정상적으로 임포트/부팅되는지만 확인한다.
      # anthropic_api_key는 필수 설정값이라 더미 값으로 채워서 임포트만 통과시킨다.
      - name: Verify FastAPI app imports cleanly
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
        run: python -c "from app.main import app; print('app import OK')"
