spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tasktriage}
    username: ${DB_USERNAME:tasktriage}
    password: ${DB_PASSWORD:tasktriage}
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)이 관리. Hibernate는 엔티티 매핑이
      # 실제 스키마와 일치하는지 검증만 함 — 자동으로 테이블을 만들거나 바꾸지 않음.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  triage:
    service-url: ${TRIAGE_SERVICE_URL:http://localhost:8001}
    confidence-threshold: ${CONFIDENCE_THRESHOLD:0.7}
    # Haiku 4.5 분류 호출 1건당 대략적인 비용 추정치. 관리자 지표의 "비용 절감 추정"에만 쓰임.
    avg-cost-per-llm-call-usd: ${AVG_LLM_COST_USD:0.0005}
    # SLA 임박 판단 기준 (마감까지 이 시간 이내면 "임박"으로 집계)
    sla-approaching-hours: ${SLA_APPROACHING_HOURS:24}
  jwt:
    # HS256은 최소 256비트(32바이트) 키가 필요 — 개발용 기본값도 그 기준을 맞춰둠.
    # 운영 환경에서는 반드시 JWT_SECRET 환경변수로 강한 무작위 값을 넣을 것.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-in-production}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
